<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Engine Room — SeaLegs OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --hull:#0c1318; --deck:#121c23; --deck-2:#18242c; --rule:#23323c;
    --ink:#e9e6dd; --mute:#7d8b95; --brass:#c9a961; --depth:#4fd1c5;
    --ember-hot:#ff5436; --ember:#ff8a3d; --ember-low:#9a6b3f;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,138,61,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(79,209,197,.05), transparent 55%),
      var(--hull);
    color:var(--ink);font-family:var(--disp);line-height:1.45;min-height:100vh;
    padding:clamp(14px,3.5vw,34px);
  }
  .wrap{max-width:1080px;margin:0 auto}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;justify-content:space-between;
    padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--brass);display:flex;align-items:center;gap:9px}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ember);
    box-shadow:0 0 10px var(--ember);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  h1{font-size:clamp(30px,6vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:8px}
  h1 em{font-style:normal;color:var(--ember)}
  .sub{color:var(--mute);font-size:13.5px;margin-top:7px}

  .controls{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .segs{display:flex;background:var(--deck);border:1px solid var(--rule);border-radius:9px;padding:3px;font-family:var(--mono)}
  .segs button{appearance:none;background:none;border:0;color:var(--mute);font-family:var(--mono);
    font-size:11.5px;letter-spacing:.04em;padding:6px 11px;border-radius:6px;cursor:pointer;transition:.18s}
  .segs button:hover{color:var(--ink)}
  .segs button[aria-pressed="true"]{background:var(--deck-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}

  .cluster{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:1px;background:var(--rule);
    border:1px solid var(--rule);border-radius:14px;overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow)}
  .gauge{background:var(--deck);padding:18px 20px;display:flex;flex-direction:column;gap:4px}
  .gauge.total{background:linear-gradient(160deg,#1a1410,var(--deck) 70%)}
  .gauge .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .gauge .val{font-family:var(--mono);font-weight:600;letter-spacing:-.01em;line-height:1}
  .gauge.total .val{font-size:clamp(34px,7vw,52px);color:var(--ember);text-shadow:0 0 28px rgba(255,138,61,.35)}
  .gauge .val.sm{font-size:clamp(20px,3.4vw,26px)}
  .gauge .foot{font-size:11.5px;color:var(--mute)}
  .gauge .foot b{color:var(--depth);font-weight:500}
  @media(max-width:720px){.cluster{grid-template-columns:1fr 1fr}.gauge.total{grid-column:1/-1}}

  .stack-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .stack-head h2{font-size:13px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:500}
  .stack-head .hint{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
  .stack{display:flex;flex-direction:column;gap:9px;min-height:60px}
  .empty{font-family:var(--mono);font-size:13px;color:var(--mute);padding:22px 4px}
  .burner{position:relative;background:var(--deck);border:1px solid var(--rule);border-radius:11px;
    padding:13px 16px 14px;cursor:pointer;overflow:hidden;transition:.16s;outline:none}
  .burner:hover,.burner:focus-visible{border-color:#36505d;transform:translateX(2px)}
  .burner .fill{position:absolute;inset:0 auto 0 0;border-radius:11px 0 0 11px;opacity:.16;z-index:0}
  .burner .row{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
  .rank{font-family:var(--mono);font-size:12px;color:var(--mute);width:26px;flex:none}
  .ember-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .bmeta{flex:1;min-width:0}
  .bname{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bplat{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:1px}
  .bplat .tag{color:var(--brass)}
  .bcost{text-align:right;flex:none}
  .bcost .c{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:-.01em}
  .bcost .p{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .bar{position:relative;height:5px;border-radius:3px;background:var(--deck-2);margin-top:11px;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;display:block}
  .chev{flex:none;color:var(--mute);font-size:13px;transition:.16s}
  .burner:hover .chev{color:var(--ink);transform:translateX(2px)}

  .scrim{position:fixed;inset:0;background:rgba(6,10,13,.62);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:.22s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--deck);
    border-left:1px solid var(--rule);box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);
    transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:50;
    display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .dr-head{padding:22px 24px 16px;border-bottom:1px solid var(--rule);position:relative}
  .dr-close{position:absolute;top:18px;right:18px;background:var(--deck-2);border:1px solid var(--rule);
    color:var(--mute);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1}
  .dr-close:hover{color:var(--ink)}
  .dr-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
  .dr-title{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:6px;padding-right:38px}
  .dr-body{padding:20px 24px 28px;overflow-y:auto;flex:1}
  .does{background:var(--deck-2);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:20px}
  .does h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:7px;font-weight:500}
  .does p{font-size:14px;color:var(--ink);line-height:1.55}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:20px}
  .metric{background:var(--deck);padding:13px 15px}
  .metric .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
  .metric .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .metric .v small{font-size:11px;color:var(--mute);font-weight:400}
  .spark-wrap .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
  svg.spark{width:100%;height:64px;display:block}

  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);
    display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
  .src{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .src b{color:var(--ember)}
  .src.live b{color:var(--depth)}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--depth);
    border:1px solid var(--rule);border-radius:99px;padding:4px 11px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">SeaLegs OS · Below Decks</div>
      <h1>The <em>Engine&nbsp;Room</em></h1>
      <div class="sub">Every API call the fleet makes, ranked by what it costs to run.</div>
    </div>
    <div class="controls">
      <div class="segs" id="rangeSeg" role="group" aria-label="Time window">
        <button data-range="24h">24h</button>
        <button data-range="7d" aria-pressed="true">7 days</button>
        <button data-range="30d">30 days</button>
        <button data-range="all">All</button>
      </div>
      <div class="segs" id="groupSeg" role="group" aria-label="Group by">
        <button data-group="process" aria-pressed="true">By process</button>
        <button data-group="platform">By platform</button>
      </div>
    </div>
  </header>

  <div class="cluster" id="cluster"></div>

  <div class="stack-head">
    <h2 id="stackTitle">Burn ranking</h2>
    <span class="hint">tap a row to see what it does</span>
  </div>
  <div class="stack" id="stack"></div>

  <footer>
    <span class="src" id="src">Connecting…</span>
    <span class="pill">● normalized to USD</span>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head">
    <button class="dr-close" id="drClose" aria-label="Close">✕</button>
    <div class="dr-eyebrow" id="drPlat"></div>
    <div class="dr-title" id="drTitle"></div>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<script>
/* ============================================================
   DATA SOURCE
   Live: GET /lab/engine-room/burn?range=… (Cloudflare function
   holds the Supabase service key; browser never sees it).
   If that call fails (e.g. previewing this file, or before
   deploy), it falls back to demo data so the page still renders.
   ============================================================ */
const ENDPOINT = '/lab/engine-room/burn';
let DATA_MODE = 'live';

async function getData(range){
  try{
    const res = await fetch(`${ENDPOINT}?range=${range}`, {headers:{accept:'application/json'}});
    if(!res.ok) throw new Error('http '+res.status);
    const p = await res.json();
    if(!p || !Array.isArray(p.by_process)) throw new Error('bad payload');
    DATA_MODE = 'live';
    return normalizeLive(p);
  }catch(e){
    DATA_MODE = 'demo';
    return demoData(range);
  }
}

function normalizeLive(p){
  const rows = p.by_process.map(x=>({
    id:x.process, name:x.label||x.process, platform:x.platform, model:x.model||null,
    calls:+x.calls||0, inTok:+x.input_tokens||0, outTok:+x.output_tokens||0,
    lat:+x.avg_latency_ms||0, cost:+x.cost_usd||0, does:x.does||'',
    trend:(x.trend||[]).map(Number)
  }));
  const t = p.totals||{};
  return {rows, totals:{cost:+t.cost_usd||0, calls:+t.calls||0, tokens:+t.tokens||0, runs:+t.runs||0}};
}

/* ---- demo fallback (mirrors the live shape) ---- */
const PRICES = {
  anthropic:{ 'opus-4.8':{in:15,out:75}, 'sonnet-4.6':{in:3,out:15}, 'haiku-4.5':{in:0.8,out:4} },
  apollo:{perCall:0.024}, webreveal:{perCall:0.010}, hubspot:{perCall:0}, supabase:{perCall:0}
};
const PROCESSES = [
  {id:'shore',name:'Shore — Stack Analysis',platform:'anthropic',model:'opus-4.8',does:'Reads the raw tech-stack signal from WebReveal and runs the 4C Audit (Cost, Coverage, Coherence, Control). The heaviest reasoning step in the pipeline.'},
  {id:'depth',name:'Depth — Report Synthesis',platform:'anthropic',model:'sonnet-4.6',does:'Turns the Shore analysis into the finished stack_report and writes the headline savings number back to Supabase.'},
  {id:'current',name:'Current — Intake & Routing',platform:'anthropic',model:'haiku-4.5',does:'First touch on every inbound lead. Classifies the company, checks ICP fit, and routes it down the right chain. Cheap model, high volume.'},
  {id:'tide',name:'Tide — Contact Enrichment',platform:'apollo',model:null,does:'Calls Apollo to enrich the company with decision-maker contacts and firmographics. Billed in Apollo credits, one charge per record.'},
  {id:'scanner',name:'T3 Scanner — WebReveal',platform:'webreveal',model:null,does:'Detects the live technology stack of a target domain. Per-call charge; the input that feeds Shore.'},
  {id:'sync',name:'HubSpot Sync',platform:'hubspot',model:null,does:'Upserts the finished report and contact into HubSpot. Inside plan limits, tracked for call volume.'},
  {id:'intake',name:'Webhook Intake',platform:'supabase',model:null,does:'Writes the inbound payload to Supabase to open a run. Effectively free; included so every run is accounted for.'}
];
function demoData(range){
  const scale = {'24h':0.16,'7d':1,'30d':4.1,'all':9}[range] ?? 1;
  const seed = {
    shore:{calls:142,inTok:1420000,outTok:498000,lat:8200},
    depth:{calls:138,inTok:690000,outTok:430000,lat:5400},
    current:{calls:1190,inTok:910000,outTok:120000,lat:900},
    tide:{calls:138,inTok:0,outTok:0,lat:1600},
    scanner:{calls:151,inTok:0,outTok:0,lat:2300},
    sync:{calls:130,inTok:0,outTok:0,lat:420},
    intake:{calls:151,inTok:0,outTok:0,lat:60}
  };
  const rows = PROCESSES.map(p=>{
    const s=seed[p.id];
    const calls=Math.max(1,Math.round(s.calls*scale));
    const inTok=Math.round(s.inTok*scale), outTok=Math.round(s.outTok*scale);
    let cost;
    if(p.platform==='anthropic'){const pr=PRICES.anthropic[p.model];cost=(inTok/1e6)*pr.in+(outTok/1e6)*pr.out;}
    else cost=calls*(PRICES[p.platform].perCall||0);
    const trend=Array.from({length:7},()=>(cost/7)*(0.6+Math.random()*0.9));
    return {...p, calls, inTok, outTok, lat:s.lat, cost, trend};
  });
  const total=rows.reduce((a,r)=>a+r.cost,0);
  const runs=Math.max(1,Math.round(seed.intake.calls*scale));
  return {rows, totals:{cost:total, calls:rows.reduce((a,r)=>a+r.calls,0),
    tokens:rows.reduce((a,r)=>a+r.inTok+r.outTok,0), runs}};
}

/* ---- state + helpers ---- */
let RANGE='7d', GROUP='process';
const RANGE_LABEL={'24h':'last 24 hours','7d':'last 7 days','30d':'last 30 days','all':'all time'};
const PLAT_LABEL={anthropic:'Anthropic',apollo:'Apollo',webreveal:'WebReveal',hubspot:'HubSpot',supabase:'Supabase'};
const fmt$=n=> n>=100?'$'+n.toFixed(0):n>=1?'$'+n.toFixed(2):n>0?'$'+n.toFixed(3):'$0';
const fmtK=n=> n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':''+n;
function emberColor(share){ return share>=.30?'var(--ember-hot)':share>=.12?'var(--ember)':'var(--ember-low)'; }

function aggregate(rows){
  if(GROUP==='process') return rows.slice();
  const byPlat={};
  rows.forEach(r=>{
    const k=r.platform;
    if(!byPlat[k]) byPlat[k]={id:k,name:PLAT_LABEL[k]||k,platform:k,model:null,calls:0,inTok:0,outTok:0,cost:0,lat:0,_n:0,
      does:`All pipeline calls routed through ${PLAT_LABEL[k]||k}, summed across every process that uses it.`,trend:Array(7).fill(0)};
    const g=byPlat[k]; g.calls+=r.calls; g.inTok+=r.inTok; g.outTok+=r.outTok; g.cost+=r.cost; g.lat+=r.lat; g._n++;
    (r.trend||[]).forEach((v,i)=>{g.trend[i]=(g.trend[i]||0)+(+v||0);});
  });
  return Object.values(byPlat).map(g=>({...g,lat:g._n?Math.round(g.lat/g._n):0}));
}

let CURRENT=[], CURRENT_TOTAL=0;

async function render(){
  const {rows, totals} = await getData(RANGE);
  const ranked = aggregate(rows).sort((a,b)=>b.cost-a.cost);
  const total = totals.cost || ranked.reduce((s,r)=>s+r.cost,0);
  CURRENT=ranked; CURRENT_TOTAL=total;
  const leads = totals.runs>0?totals.runs:Math.max(1,totals.calls||1);

  document.getElementById('cluster').innerHTML=`
    <div class="gauge total">
      <span class="label">Total burn · ${RANGE_LABEL[RANGE]}</span>
      <span class="val">${fmt$(total)}</span>
      <span class="foot"><b>${(totals.calls||0).toLocaleString()}</b> calls · <b>${fmtK(totals.tokens||0)}</b> tokens</span>
    </div>
    <div class="gauge"><span class="label">Cost / lead</span><span class="val sm">${fmt$(total/leads)}</span><span class="foot">${leads.toLocaleString()} runs</span></div>
    <div class="gauge"><span class="label">Top burner</span><span class="val sm" style="color:var(--ember)">${ranked.length&&total?((ranked[0].cost/total*100).toFixed(0)):'0'}%</span><span class="foot">${ranked.length?ranked[0].name.split(' — ')[0]:'—'}</span></div>
    <div class="gauge"><span class="label">Tracked sources</span><span class="val sm" style="color:var(--depth)">${ranked.length}</span><span class="foot">${GROUP==='process'?'processes':'platforms'}</span></div>`;

  document.getElementById('stackTitle').textContent = GROUP==='process'?'Burn ranking · by process':'Burn ranking · by platform';

  const stack=document.getElementById('stack');
  if(!ranked.length){ stack.innerHTML='<div class="empty">No calls logged in this window yet.</div>'; }
  else stack.innerHTML = ranked.map((r,i)=>{
    const share=total?r.cost/total:0, col=emberColor(share), w=Math.max(2,share*100);
    const detail = r.platform==='anthropic'
      ? `${PLAT_LABEL[r.platform]||r.platform} · <span class="tag">${r.model||''}</span> · ${fmtK(r.inTok+r.outTok)} tok`
      : `${PLAT_LABEL[r.platform]||r.platform} · ${r.calls.toLocaleString()} calls`;
    return `<div class="burner" tabindex="0" data-i="${i}" role="button" aria-label="${r.name}, ${fmt$(r.cost)}">
      <span class="fill" style="background:${col};width:${w}%"></span>
      <div class="row">
        <span class="rank">${String(i+1).padStart(2,'0')}</span>
        <span class="ember-dot" style="background:${col};box-shadow:0 0 ${share>.12?'10px':'4px'} ${col}"></span>
        <span class="bmeta"><div class="bname">${r.name}</div><div class="bplat">${detail}</div></span>
        <span class="bcost"><div class="c" style="color:${col}">${fmt$(r.cost)}</div><div class="p">${(share*100).toFixed(1)}%</div></span>
        <span class="chev">›</span>
      </div>
      <div class="bar"><i style="width:${w}%;background:linear-gradient(90deg,${col},transparent)"></i></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.burner').forEach(el=>{
    const open=()=>openDrawer(CURRENT[+el.dataset.i], CURRENT_TOTAL);
    el.addEventListener('click',open);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });

  const src=document.getElementById('src');
  if(DATA_MODE==='live'){ src.className='src live'; src.innerHTML='Source: <b>live</b> · Supabase api_traces'; }
  else { src.className='src'; src.innerHTML='Source: <b>demo data</b> — deploy behind Cloudflare Access to go live.'; }
}

function sparkline(trend){
  trend=(trend&&trend.length)?trend:[0,0,0,0,0,0,0];
  const max=Math.max(...trend,0.0001), W=380, H=64, pad=4;
  const pts=trend.map((v,i)=>{const x=pad+(i/(trend.length-1))*(W-pad*2);const y=H-pad-((+v||0)/max)*(H-pad*2);return [x,y];});
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${W-pad} ${H-pad} L ${pad} ${H-pad} Z`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--ember)" stop-opacity=".35"/>
      <stop offset="1" stop-color="var(--ember)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="var(--ember)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function openDrawer(r,total){
  if(!r) return;
  document.getElementById('drPlat').textContent = (r.platform==='anthropic'? (PLAT_LABEL[r.platform]+' · '+(r.model||'')) : (PLAT_LABEL[r.platform]||r.platform));
  document.getElementById('drTitle').textContent = r.name;
  const isTok = r.platform==='anthropic';
  const perCall = r.calls? r.cost/r.calls : 0;
  document.getElementById('drBody').innerHTML=`
    <div class="does"><h3>What it does</h3><p>${r.does||'—'}</p></div>
    <div class="metrics">
      <div class="metric"><div class="k">Burn · ${RANGE_LABEL[RANGE]}</div><div class="v" style="color:var(--ember)">${fmt$(r.cost)}</div></div>
      <div class="metric"><div class="k">Share of total</div><div class="v">${total?(r.cost/total*100).toFixed(1):'0'}<small>%</small></div></div>
      <div class="metric"><div class="k">Calls</div><div class="v">${r.calls.toLocaleString()}</div></div>
      <div class="metric"><div class="k">Cost / call</div><div class="v">${fmt$(perCall)}</div></div>
      ${isTok?`<div class="metric"><div class="k">Tokens in</div><div class="v">${fmtK(r.inTok)}</div></div>
      <div class="metric"><div class="k">Tokens out</div><div class="v">${fmtK(r.outTok)}</div></div>`:''}
      <div class="metric"><div class="k">Avg latency</div><div class="v">${(r.lat/1000).toFixed(1)}<small>s</small></div></div>
      <div class="metric"><div class="k">Unit</div><div class="v">${isTok?'tokens':'per&nbsp;call'}</div></div>
    </div>
    <div class="spark-wrap"><div class="k">Burn trend · last 7 days</div>${sparkline(r.trend)}</div>`;
  document.getElementById('scrim').classList.add('open');
  const dr=document.getElementById('drawer'); dr.classList.add('open'); dr.setAttribute('aria-hidden','false');
}
function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  const dr=document.getElementById('drawer'); dr.classList.remove('open'); dr.setAttribute('aria-hidden','true');
}

document.getElementById('rangeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  RANGE=b.dataset.range;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});
document.getElementById('groupSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  GROUP=b.dataset.group;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.getElementById('drClose').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

render();
</script>
</body>
</html>
