<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Digital Synthesis Disintegration</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0e15;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      text-align: center;
    }

    canvas {
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <canvas id="synthesisCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('synthesisCanvas');
  const ctx = canvas.getContext('2d');

  // Configuration
  const PARTICLE_SPACING = 3; // Adjust space between particles (smaller = more particles)
  const MOUSE_RADIUS = 120;   // Area of effect around the mouse cursor
  const RETURN_SPEED = 0.08;  // How quickly particles snap back (0.01 - 0.1)
  const EASE_FACTOR = 0.1;

  let particles = [];
  let mouse = { x: null, y: null, active: false };

  // Load the Image
  const img = new Image();
  img.crossOrigin = "Anonymous"; // Allows canvas data extraction for external URLs
  img.src = "YOUR_IMAGE_URL_HERE.jpg"; // Replace with your image path

  img.onload = () => {
    // Set canvas dimensions matching the image
    canvas.width = img.width;
    canvas.height = img.height;

    // Draw temporary image to read pixel data
    ctx.drawImage(img, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sample pixels to create ~1,000s of particles
    for (let y = 0; y < canvas.height; y += PARTICLE_SPACING) {
      for (let x = 0; x < canvas.width; x += PARTICLE_SPACING) {
        const index = (y * canvas.width + x) * 4;
        const alpha = imgData.data[index + 3];

        // Skip fully transparent pixels
        if (alpha > 128) {
          const red = imgData.data[index];
          const green = imgData.data[index + 1];
          const blue = imgData.data[index + 2];
          
          particles.push(new Particle(x, y, `rgb(${red},${green},${blue})`));
        }
      }
    }

    animate();
  };

  // Particle Class
  class Particle {
    constructor(x, y, color) {
      this.originX = x;
      this.originY = y;
      this.x = x;
      this.y = y;
      this.color = color;
      this.size = PARTICLE_SPACING * 0.9;
      this.vx = 0;
      this.vy = 0;
      this.friction = 0.88;
      this.ease = RETURN_SPEED;
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }

    update() {
      if (mouse.active) {
        // Calculate distance between mouse and particle
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < MOUSE_RADIUS) {
          // Push particles away from the cursor
          const angle = Math.atan2(dy, dx);
          const force = (MOUSE_RADIUS - distance) / MOUSE_RADIUS;
          const pushX = Math.cos(angle) * force * 15;
          const pushY = Math.sin(angle) * force * 15;

          this.vx -= pushX;
          this.vy -= pushY;
        }
      }

      // Physics movement & return logic
      this.vx *= this.friction;
      this.vy *= this.friction;

      this.x += this.vx + (this.originX - this.x) * this.ease;
      this.y += this.vy + (this.originY - this.y) * this.ease;
    }
  }

  // Animation Loop
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }
    
    requestAnimationFrame(animate);
  }

  // Track Mouse Interaction
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    mouse.active = true;
  });

  canvas.addEventListener('mouseleave', () => {
    mouse.active = false;
  });
</script>

</body>
</html>
